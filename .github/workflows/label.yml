name: label
on:
  pull_request_target:
    branches:
      - develop

jobs:
  pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@f1a63e87db0c6baf19c5713083f8d00d789ca184
